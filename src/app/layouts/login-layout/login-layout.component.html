<section class="auth-wrapper">
  <div class="auth-card" [style.max-width]="maxWidth()">
    <span class="auth-card__stripe" aria-hidden="true"></span>

    <div class="auth-card__body">
      @if (backRoute()) {
        <a class="auth-back" [routerLink]="backRoute()">
          <i class="pi pi-arrow-left"></i>
          <span>{{ backLabel() }}</span>
        </a>
      }

      <header class="auth-header">
        @if (showLogo()) {
          <img class="auth-logo" src="logo.png" alt="Proauto Kimium" />
        }
        @if (title()) {
          <h1 class="auth-title">{{ title() }}</h1>
        }
        @if (subtitle()) {
          <p class="auth-subtitle">{{ subtitle() }}</p>
        }
      </header>

      <div class="auth-content">
        <ng-content />
      </div>

      @if (footerText()) {
        <p class="auth-footer">{{ footerText() }}</p>
      }
    </div>
  </div>
</section>
