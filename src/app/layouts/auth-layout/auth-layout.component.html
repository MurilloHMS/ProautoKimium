<app-topbar (menuToggle)="drawerOpen.set(true)" />

<app-nav-drawer [open]="drawerOpen()" (closed)="drawerOpen.set(false)" />

<app-tab-bar />

<main class="app-content">
  <!-- DENTRO do .app-content de proposito: a topbar e `position: fixed`, e e o
       .app-content que compensa a altura dela com padding-top. Fora daqui, a
       faixa nasce debaixo da topbar e aparece cortada - no iPhone com notch a
       barra e ainda mais alta, e engole quase tudo. -->
  <app-instalar />

  <!-- A tela em foco não está guardada no TabHandleStore: é por aqui que o
       serviço de abas alcança a instância dela para checar formulário sujo. -->
  <router-outlet
    (activate)="tabs.setActiveComponent($event)"
    (deactivate)="tabs.setActiveComponent(null)" />
</main>

<app-bottom-nav />
