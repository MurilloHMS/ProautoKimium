@if (tabs.enabled() && tabs.tabs().length > 0) {
  <div class="tab-bar">
    <div class="tab-bar__list" role="tablist">
      @for (tab of tabs.tabs(); track tab.url) {
        <div class="tab" [class.is-active]="tab.url === tabs.activeUrl()">
          <button type="button"
                  class="tab__main"
                  role="tab"
                  [attr.aria-selected]="tab.url === tabs.activeUrl()"
                  [title]="tab.label"
                  (click)="tabs.activate(tab)"
                  (auxclick)="onAuxClick($event, tab)">
            <i class="tab__icon" [class]="tab.icon"></i>
            <span class="tab__label">{{ tab.label }}</span>
          </button>

          <button type="button"
                  class="tab__close"
                  [attr.aria-label]="'Fechar ' + tab.label"
                  (click)="tabs.close(tab.url)">
            <i class="pi pi-times"></i>
          </button>
        </div>
      }
    </div>

    @if (tabs.hasMany()) {
      <div class="tab-bar__menu">
        <button type="button"
                class="tab-bar__menu-btn"
                aria-label="Ações das abas"
                [attr.aria-expanded]="menuOpen()"
                (click)="menuOpen.set(!menuOpen())">
          <i class="pi pi-ellipsis-h"></i>
        </button>

        @if (menuOpen()) {
          <div class="tab-bar__dropdown" role="menu">
            <button type="button" role="menuitem" (click)="closeOthers()">
              <i class="pi pi-times-circle"></i> Fechar as outras
            </button>
            <button type="button" role="menuitem" (click)="closeAll()">
              <i class="pi pi-trash"></i> Fechar todas
            </button>
          </div>
        }
      </div>
    }
  </div>
}
