<nav class="bottom-nav" aria-label="Navegação rápida"
     [style.--total]="items().length"
     [style.--indice]="indiceAtivo()">

  <!-- A pílula fica atrás dos itens e some quando a tela atual não é nenhum
       deles — melhor nada do que um indicador apontando para o item errado. -->
  @if (indiceAtivo() >= 0) {
    <span class="bottom-nav__pilula" aria-hidden="true"></span>
  }

  @for (item of items(); track item.path; let i = $index) {
    <!-- A contagem vai no `aria-label` porque o tema não tem classe de texto
         só para leitor de tela, e classe inventada não estiliza nada. -->
    <a class="bottom-nav__item"
       [routerLink]="item.routerLink"
       [class.is-active]="i === indiceAtivo()"
       [attr.aria-current]="i === indiceAtivo() ? 'page' : null"
       [attr.aria-label]="item.contador && naoLidas() > 0
         ? item.label + ': ' + naoLidas() + (naoLidas() === 1 ? ' não lida' : ' não lidas')
         : null">

      <span class="bottom-nav__icone">
        <i [class]="item.icon"></i>

        @if (item.contador && naoLidas() > 0) {
          <span class="bottom-nav__ponto"></span>
        }
      </span>

      <span class="bottom-nav__rotulo">{{ item.label }}</span>

    </a>
  }
</nav>
