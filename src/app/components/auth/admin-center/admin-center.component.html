<p-toast></p-toast>

<!-- As camadas do padrão de 2026-10-08: barra branca, abas sobre o cinza, painéis brancos. -->
<div class="pk-page">
  <header class="pk-page__bar">
    <div class="pk-page__title">
      <h1>Administração</h1>
      <p>Contas, o que cada uma acessa, e os modelos de acesso</p>
    </div>

    @if (canCreate()) {
      <div class="pk-page__actions">
        <pk-button pkType="new" pkSize="sm"
                   [pkLabel]="aba() === 'usuarios' ? 'Novo usuário' : 'Novo modelo'"
                   (clicked)="novo()" />
      </div>
    }
  </header>

  <nav class="pk-page__tabs">
    <div class="pk-tabs" role="tablist" aria-label="Partes da administração">
      <button type="button" class="pk-tabs__tab" role="tab" id="abaUsuarios"
              [attr.aria-selected]="aba() === 'usuarios'" aria-controls="painelAdmin"
              (click)="trocarAba('usuarios')">
        Usuários @if (userCount() !== null) { <small>{{ userCount() }}</small> }
      </button>
      <button type="button" class="pk-tabs__tab" role="tab" id="abaModelos"
              [attr.aria-selected]="aba() === 'modelos'" aria-controls="painelAdmin"
              (click)="trocarAba('modelos')">
        Modelos @if (templateCount() !== null) { <small>{{ templateCount() }}</small> }
      </button>
    </div>
  </nav>

  <div class="pk-page__body" id="painelAdmin" role="tabpanel"
       [attr.aria-labelledby]="aba() === 'usuarios' ? 'abaUsuarios' : 'abaModelos'">
    @if (aba() === 'usuarios') {
      <app-admin-users [initialLogin]="usuarioDaUrl" (counted)="userCount.set($event)" />
    } @else {
      <app-admin-templates (counted)="templateCount.set($event)" />
    }
  </div>
</div>
