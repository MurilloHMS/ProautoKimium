<div class="assinatura">

  <app-page-header
    icon="pi pi-envelope"
    title="Assinatura de e-mail"
    subtitle="Preencha os dados e copie a imagem para colar no Outlook.">
    @if (podeEditar()) {
      <pk-segmented
        actions
        [options]="opcoesDeModo"
        [value]="modo()"
        (valueChange)="modo.set($event)"
        ariaLabel="Modo da tela" />
    }
  </app-page-header>

  @if (carregando()) {
    <p class="assinatura__estado">Carregando o modelo…</p>
  } @else if (erro()) {
    <p class="assinatura__erro">
      <i class="pi pi-exclamation-triangle"></i>
      {{ erro() }}
    </p>
  } @else {

    <div class="assinatura__conteudo">

      <!-- ═══ A prévia, que É o arquivo ═══════════════════════════════ -->
      <section class="assinatura__prancheta">
        <canvas #tela class="assinatura__canvas" role="img"
                aria-label="Prévia da assinatura de e-mail"></canvas>

        @if (modo() === 'layout') {
          <p class="assinatura__nota">
            <i class="pi pi-info-circle"></i>
            Campo em branco aparece com o texto de exemplo, só aqui.
          </p>
        }
      </section>

      <!-- ═══ O formulário, montado a partir do template ══════════════ -->
      <section class="assinatura__painel">

        @for (campo of campos(); track campo.id) {
          <pk-input
            [label]="campo.rotulo"
            [placeholder]="campo.exemplo"
            [pkRequired]="campo.obrigatorio"
            [type]="campo.tipo === 'EMAIL' ? 'email' : campo.tipo === 'TELEFONE' ? 'tel' : 'text'"
            [ngModel]="valorDe(campo)"
            (ngModelChange)="aoDigitar(campo.chave, $event)"
            [name]="campo.chave" />
        }

        @if (aviso()) {
          <p class="assinatura__aviso">{{ aviso() }}</p>
        }

        <div class="assinatura__acoes">
          <pk-button
            pkType="save" pkIcon="pi pi-copy" pkLabel="Copiar imagem"
            [pkDisabled]="incompleto()" (clicked)="copiar()" />
          <pk-button
            pkType="download" pkLabel="Baixar PNG"
            [pkDisabled]="incompleto()" (clicked)="baixar()" />
          <button type="button" class="assinatura__limpar" (click)="limpar()">Limpar</button>
        </div>

      </section>

    </div>
  }

</div>
