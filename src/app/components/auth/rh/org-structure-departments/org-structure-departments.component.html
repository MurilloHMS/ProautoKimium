<p-toast position="top-right"></p-toast>
<p-confirmDialog />

@if (mode() === 'grid') {

  <app-toolbar>
    <pk-button pkType="new" (clicked)="openForm()" pkLabel="Novo Departamento" pkSize="sm"/>
    <pk-button pkType="refresh" (clicked)="reload()" pkLabel="Atualizar" pkSize="sm"/>

    <div filters>
      <input type="text"
             class="toolbar-search"
             placeholder="Buscar por nome…"
             aria-label="Buscar departamentos"
             (input)="grid.filterGlobal($any($event.target).value)" />
    </div>
  </app-toolbar>
  <div class="table-card">
    <pk-table
      #grid
      [showCaption]="false"
      [data]="departments()"
      [loading]="loading()"
      [filterFields]="['name']"
      emptyIcon="pi pi-sitemap"
      emptyTitle="Nenhum departamento cadastrado"
      emptySubtitle="Adicione um novo departamento para começar."
      pageReportTitle="Departamentos">

      <!-- Departamento so tem nome: o cartao e o caso minimo da anatomia. -->
      <ng-template #cardTpl let-d>
        <article class="pk-cartao">
          <button type="button" class="pk-cartao__corpo" (click)="openEdit(d)">
            <span class="pk-cartao__titulo">{{ d.name }}</span>
            <span class="pk-cartao__sub">Toque para editar</span>
          </button>
          <div class="pk-cartao__rodape">
            <button type="button" class="pk-cartao__icone"
                    [attr.aria-label]="'Excluir ' + d.name" (click)="confirmDelete(d)">
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </article>
      </ng-template>

      <ng-template #headerTpl>
        <tr>
          <th pSortableColumn="name">Nome <p-sortIcon field="name"></p-sortIcon></th>
          <th class="col-actions">Ações</th>
        </tr>
      </ng-template>

      <ng-template #bodyTpl let-d>
        <tr class="table-row">
          <td>{{ d.name }}</td>
          <td class="col-actions">
            <div class="row-actions">
              <pk-button pkType="edit" [pkIconOnly]="true" pkSize="sm"
                         pkTooltip="Editar" (clicked)="openEdit(d)"/>
              <pk-button pkType="delete" [pkIconOnly]="true" pkSize="sm"
                         pkTooltip="Excluir" (clicked)="confirmDelete(d)"/>
            </div>
          </td>
        </tr>
      </ng-template>

    </pk-table>
  </div>

} @else {

  <app-form-screen [title]="editing() ? 'Editar Departamento' : 'Novo Departamento'"
                   [subtitle]="editing() ? 'Alteração de departamento' : 'Cadastro de departamento'"
                   (back)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="form-field form-field--full">
          <pk-input label="Nome" placeholder="Ex: Administrativo" [pkRequired]="true" [pkMaxLength]="100" type="text" formControlName="name"/>
        </div>
      </div>
    </form>

    <div formActions>
      <pk-button pkType="cancel" (clicked)="closeForm()" pkLabel="Cancelar" pkSize="sm"/>
      <pk-button pkType="save" (clicked)="save()" pkLabel="Salvar" pkSize="sm" [pkDisabled]="form.invalid"/>
    </div>
  </app-form-screen>

}
