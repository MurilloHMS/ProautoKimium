<p-toast position="top-right"></p-toast>
<p-confirmDialog />

@if (mode() === 'grid') {

  <app-toolbar>
    <pk-button pkType="new" (clicked)="openForm()" pkLabel="Novo Setor" pkSize="sm"/>
    <pk-button pkType="refresh" (clicked)="reload()" pkLabel="Atualizar" pkSize="sm"/>

    <div filters>
      <input type="text"
             class="toolbar-search"
             placeholder="Buscar por nome…"
             aria-label="Buscar setores"
             (input)="grid.filterGlobal($any($event.target).value)" />
    </div>
  </app-toolbar>
  <div class="table-card">
    <pk-table
      #grid
      [showCaption]="false"
      [data]="teams()"
      [loading]="loading()"
      [filterFields]="['name']"
      emptyIcon="pi pi-users"
      emptyTitle="Nenhum setor cadastrado"
      emptySubtitle="Adicione um novo setor para começar."
      pageReportTitle="Setores">

      <ng-template #headerTpl>
        <tr>
          <th pSortableColumn="name">Nome <p-sortIcon field="name"></p-sortIcon></th>
          <th>Departamento</th>
          <th class="col-actions">Ações</th>
        </tr>
      </ng-template>

      <ng-template #bodyTpl let-t>
        <tr class="table-row">
          <td>{{ t.name }}</td>
          <td>{{ t.department?.name }}</td>
          <td class="col-actions">
            <div class="row-actions">
              <pk-button pkType="edit" [pkIconOnly]="true" pkSize="sm"
                         pkTooltip="Editar" (clicked)="openEdit(t)"/>
              <pk-button pkType="delete" [pkIconOnly]="true" pkSize="sm"
                         pkTooltip="Excluir" (clicked)="confirmDelete(t)"/>
            </div>
          </td>
        </tr>
      </ng-template>

    </pk-table>
  </div>

} @else {

  <app-form-screen [title]="editing() ? 'Editar Setor' : 'Novo Setor'" subtitle="Cadastro de setor vinculado a um departamento" (back)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="form-field form-field--full">
          <pk-input label="Nome" placeholder="Ex: Compras" [pkRequired]="true" [pkMaxLength]="100" type="text" formControlName="name"/>
        </div>
        <div class="form-field form-field--full">
          <label for="departmentId">Departamento <span class="required">*</span></label>
          <p-select
            id="departmentId"
            [options]="departmentOptions()"
            formControlName="departmentId"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            placeholder="Selecione…"
            styleClass="select-field">
          </p-select>
          @if (form.get('departmentId')?.invalid && form.get('departmentId')?.touched) {
            <small class="field-error">Campo obrigatório</small>
          }
        </div>
      </div>
    </form>

    <div formActions>
      <pk-button pkType="cancel" (clicked)="closeForm()" pkLabel="Cancelar" pkSize="sm"/>
      <pk-button pkType="save" (clicked)="save()" pkLabel="Salvar" pkSize="sm" [pkDisabled]="form.invalid"/>
    </div>
  </app-form-screen>

}
