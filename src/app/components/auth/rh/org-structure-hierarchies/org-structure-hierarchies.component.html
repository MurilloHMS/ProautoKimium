<p-toast position="top-right"></p-toast>

@if (mode() === 'grid') {

  <app-toolbar>
    <pk-button pkType="new" (clicked)="openForm()" pkLabel="Nova Hierarquia" pkSize="sm"/>
    <pk-button pkType="refresh" (clicked)="reload()" pkLabel="Atualizar" pkSize="sm"/>

    <div filters>
      <input type="text"
             class="toolbar-search"
             placeholder="Buscar por nome…"
             aria-label="Buscar hierarquias"
             (input)="grid.filterGlobal($any($event.target).value)" />
    </div>
  </app-toolbar>
  <div class="table-card">
    <pk-table
      #grid
      [showCaption]="false"
      [data]="hierarchies()"
      [loading]="loading()"
      [filterFields]="['name']"
      emptyIcon="pi pi-sort-amount-down"
      emptyTitle="Nenhuma hierarquia cadastrada"
      emptySubtitle="Adicione uma nova hierarquia para começar."
      pageReportTitle="Hierarquias">

      <ng-template #headerTpl>
        <tr>
          <th>Nível</th>
          <th pSortableColumn="name">Nome <p-sortIcon field="name"></p-sortIcon></th>
        </tr>
      </ng-template>

      <ng-template #bodyTpl let-h>
        <tr class="table-row">
          <td><span class="code-badge">{{ h.levelOrder }}</span></td>
          <td>{{ h.name }}</td>
        </tr>
      </ng-template>

    </pk-table>
  </div>

} @else {

  <app-form-screen title="Nova Hierarquia" subtitle="Quanto menor o nível, mais alto na hierarquia" (back)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="form-field form-field--full">
          <pk-input label="Nome" placeholder="Ex: Coordenador" [pkRequired]="true" [pkMaxLength]="50" type="text" formControlName="name"/>
        </div>
        <div class="form-field form-field--full">
          <pk-input label="Nível" placeholder="Ex: 5 (quanto menor, mais alto na hierarquia)" [pkRequired]="true" type="number" formControlName="levelOrder"/>
        </div>
      </div>
    </form>

    <div formActions>
      <pk-button pkType="cancel" (clicked)="closeForm()" pkLabel="Cancelar" pkSize="sm"/>
      <pk-button pkType="save" (clicked)="save()" pkLabel="Salvar" pkSize="sm" [pkDisabled]="form.invalid"/>
    </div>
  </app-form-screen>

}
