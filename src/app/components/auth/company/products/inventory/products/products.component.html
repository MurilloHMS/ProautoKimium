@if (mode() === 'grid') {

<app-toolbar>
  <pk-button pkType="new" pkSize="sm" pkLabel="Novo Produto" (clicked)="showDialog()"/>
  <pk-button pkType="refresh" pkSize="sm" pkLabel="Atualizar" (clicked)="loadProducts()"/>
</app-toolbar>

<div class="card">
  <p-table
    #dt1
    [value]="products()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5,10,20]"
    [loading]="loading()"
    [responsiveLayout]="'scroll'"
    [globalFilterFields]="['Cód Sistema', 'Nome', 'Estoque Mínimo']"
    [rowHover]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Cód Sistema</th>
        <th>Nome</th>
        <th>Estoque Mínimo</th>
        <th>Ativo</th>
        <th>Editar</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>{{ product.systemCode }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.minimumStock }}</td>
        <td>
            <i class="pi" [ngClass]="{ 'text-green-500 pi-check-circle': product.active, 'text-red-500 pi-times-circle': !product.active}"></i>
        </td>
        <td>
          <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-info p-mr-2" (click)="editProduct(product)"></button>
          <!-- <button pButton type="button" icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="deleteCustomer(customer)"></button> -->
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">Nenhum produto encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

}

@if (mode() === 'form') {
  <app-form-screen
    [title]="productToEdit ? 'Editar Produto' : 'Adicionar Produto'"
    subtitle="Produto controlado no estoque"
    (back)="closeForm()">

    <form [formGroup]="form" (ngSubmit)="saveProduct()">
      <div class="form-grid">
        <div class="form-field">
          <label for="systemCode">Cód Sistema</label>
          <input id="systemCode" type="text" formControlName="systemCode" [readOnly]="productToEdit !== null" />
        </div>
        <div class="form-field">
          <label for="minimumStock">Estoque Mínimo</label>
          <input id="minimumStock" type="number" formControlName="minimumStock" />
        </div>
        <div class="form-field form-field--full">
          <label for="name">Nome</label>
          <input id="name" type="text" formControlName="name" />
        </div>
        <div class="form-field form-field--full">
          <pk-checkbox formControlName="active" label="Ativo" description="Produto disponível para movimentação de estoque"/>
        </div>
      </div>
    </form>

    <div formActions>
      <pk-button pkType="cancel" pkSize="sm" pkLabel="Cancelar" (clicked)="closeForm()"/>
      <pk-button pkType="save" pkSize="sm" pkLabel="Salvar" [pkDisabled]="form.invalid" (clicked)="saveProduct()"/>
    </div>
  </app-form-screen>
}
