<div class="endereco" [formGroup]="group()">
  <div class="endereco__cep" (input)="aoDigitarCep($event)">
    <pk-input label="CEP" placeholder="87020-900" formControlName="zipCode" [pkMaxLength]="9"
              [hint]="buscando() ? 'Buscando endereço…' : (naoEncontrado() ? 'CEP não encontrado. Preencha à mão.' : 'Preenche rua, bairro e cidade')"/>
  </div>
  <div class="endereco__rua">
    <pk-input label="Logradouro" placeholder="Av. Colombo" formControlName="street" [pkRequired]="required()" [pkMaxLength]="150"/>
  </div>
  <div class="endereco__numero">
    <pk-input label="Número" placeholder="5790" formControlName="number" [pkMaxLength]="20"/>
  </div>
  <div class="endereco__complemento">
    <pk-input label="Complemento" placeholder="Bloco A" formControlName="complement" [pkMaxLength]="100"/>
  </div>
  <div class="endereco__bairro">
    <pk-input label="Bairro" placeholder="Zona 7" formControlName="district" [pkMaxLength]="100"/>
  </div>
  <div class="endereco__cidade">
    <pk-input label="Cidade" placeholder="Maringá" formControlName="city" [pkRequired]="required()" [pkMaxLength]="100"/>
  </div>
  <div class="endereco__uf">
    <pk-input label="UF" placeholder="PR" formControlName="state" [pkMaxLength]="2"/>
  </div>

  <!--
    O ponto no mapa não tem campo, mas tem que dar sinal: quem cadastra precisa
    saber, antes de salvar, que aquele endereço não vai abrir no Uber.
  -->
  @if (localizando()) {
    <p class="endereco__ponto" data-testid="ponto-status">
      <i class="pi pi-spin pi-spinner"></i> Localizando no mapa…
    </p>
  } @else if (pontoManual()) {
    <p class="endereco__ponto endereco__ponto--ok" data-testid="ponto-status">
      <i class="pi pi-check-circle"></i>
      Ponto definido à mão — o Uber vai abrir aqui.
      <button type="button" class="endereco__link" (click)="descartarPontoManual()">Remover</button>
    </p>
  } @else if (semPonto()) {
    <div class="endereco__ponto endereco__ponto--aviso" data-testid="ponto-status">
      <i class="pi pi-exclamation-triangle"></i>
      <div class="endereco__ponto-corpo">
        <p class="endereco__ponto-texto">
          Não encontramos este endereço no mapa. Dá para salvar assim — só o Uber
          não vai aparecer em "Como chegar".
        </p>

        <!--
          O caminho de escape: o OpenStreetMap não conhece toda rua, e sem isto
          o endereço fica sem ponto para sempre. Com o par colado, o Uber e o
          mapa passam a cair no lugar exato.
        -->
        <div class="endereco__ponto-manual">
          <pk-input label="Ou informe o ponto do mapa"
                    placeholder="-23.652, -46.456"
                    hint="No Google Maps: botão direito no local e clique nas coordenadas para copiar. A URL também serve."
                    [errorMsg]="erroDoPonto()"
                    [formControl]="campoPonto"/>
          <pk-button pkType="save" pkLabel="Usar este ponto" pkSize="sm"
                     (clicked)="aplicarPontoManual()"/>
        </div>
      </div>
    </div>
  }
</div>
