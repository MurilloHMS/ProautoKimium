<app-login-layout
  title="Área do Funcionário"
  subtitle="Entre com suas credenciais para acessar sua conta"
  footerText="Acesso restrito a funcionários cadastrados"
  backRoute="/">

  <form class="auth-form" (ngSubmit)="login()" [formGroup]="form" novalidate>

    <div class="auth-field">
      <label class="auth-label" for="username">CPF, e-mail ou usuário</label>
      <div class="auth-input-wrap">
        <span class="auth-icon"><i class="pi pi-user"></i></span>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="auth-input"
          placeholder="CPF, e-mail ou usuário"
          autocomplete="username"
          inputmode="text"
          autocapitalize="none"
          [mask]="identifierMask"
          [dropSpecialCharacters]="false"
          (input)="onIdentifierInput($event)" />
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="password">Senha</label>
      <div class="auth-input-wrap">
        <span class="auth-icon"><i class="pi pi-lock"></i></span>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="auth-input"
          placeholder="••••••••"
          autocomplete="current-password" />
      </div>
    </div>

    @if (errorMessage) {
      <p class="auth-error-banner" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </p>
    }

    <div class="auth-links">
      <a routerLink="/login/first-access" class="auth-link">Primeiro acesso?</a>
      <a routerLink="/login/forgot-password" class="auth-link">Esqueceu a senha?</a>
    </div>

    <button type="submit" class="auth-submit" [disabled]="form.invalid || loading">
      <span>{{ loading ? 'Entrando...' : 'Entrar' }}</span>
      <i class="pi pi-arrow-right"></i>
    </button>

  </form>
</app-login-layout>
