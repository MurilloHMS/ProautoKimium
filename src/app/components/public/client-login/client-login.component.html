<app-login-layout
  title="Área do Cliente"
  subtitle="Entre com suas credenciais para acessar sua conta"
  footerText="Acesso restrito a clientes cadastrados"
  backRoute="/">

  <form class="auth-form" [formGroup]="form" (ngSubmit)="login()" novalidate>

    <div class="auth-field">
      <label class="auth-label" for="email">E-mail</label>
      <div class="auth-input-wrap">
        <span class="auth-icon"><i class="pi pi-envelope"></i></span>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="auth-input"
          placeholder="seu@email.com"
          autocomplete="email"
          inputmode="email"
          autocapitalize="none" />
      </div>
      @if (form.get('email')?.touched && form.get('email')?.invalid) {
        <small class="auth-error"><i class="pi pi-exclamation-circle"></i> Informe um e-mail válido.</small>
      }
    </div>

    <div class="auth-field">
      <label class="auth-label" for="password">Senha</label>
      <div class="auth-input-wrap">
        <span class="auth-icon"><i class="pi pi-lock"></i></span>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="auth-input"
          placeholder="••••••••"
          autocomplete="current-password" />
      </div>
    </div>

    @if (errorMessage) {
      <p class="auth-error-banner" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </p>
    }

    <div class="auth-links">
      <a routerLink="/login/forgot-password" class="auth-link">Esqueceu a senha?</a>
    </div>

    <button type="submit" class="auth-submit" [disabled]="form.invalid || loading">
      <span>{{ loading ? 'Entrando...' : 'Entrar' }}</span>
      <i class="pi pi-arrow-right"></i>
    </button>

  </form>
</app-login-layout>
