<app-login-layout
  title="Área do Cliente"
  subtitle="Use seu e-mail corporativo ou CNPJ para entrar."
  footerText="Acesso restrito a clientes cadastrados"
  backRoute="/">

  <form class="auth-form" [formGroup]="form" (ngSubmit)="login()" novalidate>

    <div class="auth-field">
      <label class="auth-label" for="login">E-mail ou CNPJ</label>
      <div class="auth-input-wrap">
        <span class="auth-icon"><i class="pi pi-user"></i></span>
        <input
          type="text"
          id="login"
          formControlName="login"
          class="auth-input"
          placeholder="seu@email.com.br ou 00.000.000/0000-00"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false" />
      </div>
      @if (form.get('login')?.touched && form.get('login')?.invalid) {
        <small class="auth-error"><i class="pi pi-exclamation-circle"></i> Informe seu e-mail ou CNPJ.</small>
      }
    </div>

    <div class="auth-field">
      <label class="auth-label" for="password">Senha</label>
      <div class="auth-input-wrap">
        <span class="auth-icon"><i class="pi pi-lock"></i></span>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="auth-input"
          placeholder="••••••••"
          autocomplete="current-password" />
      </div>
    </div>

    @if (errorMessage) {
      <p class="auth-error-banner" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </p>
    }

    <div class="auth-links">
      <a routerLink="/login/forgot-password" class="auth-link">Esqueceu a senha?</a>
    </div>

    <button type="submit" class="auth-submit" [disabled]="form.invalid || loading">
      <span>{{ loading ? 'Entrando...' : 'Entrar' }}</span>
      <i class="pi pi-arrow-right"></i>
    </button>

  </form>
</app-login-layout>
