<app-client-auth-layout
  title="Acesse sua conta"
  subtitle="Use seu e-mail corporativo ou CNPJ para entrar.">

  <form [formGroup]="form" (ngSubmit)="login()" novalidate>

    <label class="field__label" for="login">E-MAIL OU CNPJ</label>
    <div class="field">
      <i class="pi pi-envelope"></i>
      <input
        type="text"
        id="login"
        formControlName="login"
        placeholder="email@seudominio.com.br"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false" />
    </div>
    @if (form.get('login')?.touched && form.get('login')?.invalid) {
      <small class="field__error"><i class="pi pi-exclamation-circle"></i> Informe seu e-mail ou CNPJ.</small>
    }

    <label class="field__label" for="password">SENHA</label>
    <div class="field">
      <i class="pi pi-shield"></i>
      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="••••••••••"
        autocomplete="current-password" />
    </div>

    <div class="aux">
      <label class="aux__remember">
        <input type="checkbox" formControlName="remember" />
        <span>Lembrar de mim</span>
      </label>

      <a routerLink="/cliente/esqueci-senha" class="aux__link">Esqueci minha senha</a>
    </div>

    @if (errorMessage) {
      <p class="card__error" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </p>
    }

    <button type="submit" class="submit" [disabled]="form.invalid || loading">
      <span>{{ loading ? 'Entrando…' : 'Entrar' }}</span>
      <i class="pi" [class.pi-arrow-right]="!loading" [class.pi-spin]="loading" [class.pi-spinner]="loading"></i>
    </button>
  </form>

  <p class="card__or">— OU —</p>

  <p class="card__signup">
    Primeiro acesso?
    <a href="mailto:sac@proautokimium.com.br?subject=Acesso%20%C3%A0%20%C3%81rea%20do%20Cliente">
      Solicite seu cadastro
    </a>
  </p>
</app-client-auth-layout>
