<!--
  No celular a linha vira cartão. A tabela do PrimeNG continua montada, mas
  SEM LINHAS — e escondida.

  Parece contraditório, e é o preço de uma coisa concreta: o `@ViewChild('dt',
  { static: true })` não enxerga dentro de um `@if`, e o provider de `Table`
  deste componente serve justamente esse `dt` às diretivas que as telas usam no
  cabeçalho projetado (`pSortableColumn`). Pôr a tabela num `@if` deixaria `dt`
  indefinido TAMBÉM no desktop, e a ordenação morreria em silêncio.

  O que pesa numa tabela de oito colunas são as linhas, não a casca: com
  `[value]` vazio, o aparelho que nunca vai mostrar a tabela também não monta
  nenhuma delas.
-->
<div class="pk-table-card" [hidden]="mostrarCartoes()">
  <p-table
    #dt
    [value]="mostrarCartoes() ? [] : data()"
    [paginator]="true"
    [rows]="rows()"
    [rowsPerPageOptions]="rowsOptions()"
    [loading]="loading()"
    [responsiveLayout]="'scroll'"
    [globalFilterFields]="filterFields()"
    [rowHover]="true"
    [scrollable]="true"
    scrollHeight="flex"
    styleClass="pk-table"
    size="small"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} {{ pageReportTitle()}}">

    @if (showCaption()) {
      <ng-template pTemplate="caption">
        <div class="pk-table-caption">
        <span class="pk-table-caption__count">
          <strong>{{ data().length }}</strong> {{ totalLabel() }}
        </span>
        <span class="pk-table-caption__search">
            <pk-input
              type="text"
              icon="pi pi-search"
              [placeholder]="searchPlaceholder()"
              (input)="filterGlobal($any($event.target).value)" />
          </span>
        </div>
      </ng-template>
    }

    <ng-template pTemplate="header">
      <ng-container *ngTemplateOutlet="headerTpl"></ng-container>
    </ng-template>

    <ng-template pTemplate="body" let-rowData>
      <ng-container *ngTemplateOutlet="bodyTpl; context: { $implicit: rowData }"></ng-container>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="100">
          <div class="pk-empty-state">
            <i [class]="emptyIcon() + ' pk-empty-state__icon'"></i>
            <p class="pk-empty-state__title">{{ emptyTitle() }}</p>
            <p class="pk-empty-state__subtitle" *ngIf="emptySubtitle()">{{ emptySubtitle() }}</p>
          </div>
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

@if (mostrarCartoes()) {
  <div class="pk-cartoes">

    @if (showCaption()) {
      <div class="pk-cartoes__barra">
        <span class="pk-cartoes__contagem">
          <strong>{{ linhasFiltradas().length }}</strong> {{ totalLabel() }}
        </span>
        <pk-input
          type="text"
          icon="pi pi-search"
          [placeholder]="searchPlaceholder()"
          (input)="filterGlobal($any($event.target).value)" />
      </div>
    }

    @for (linha of linhasVisiveis(); track $index) {
      <ng-container *ngTemplateOutlet="cardTpl; context: { $implicit: linha }" />
    } @empty {
      <pk-empty
        [icon]="emptyIcon()"
        [title]="emptyTitle()"
        [subtitle]="emptySubtitle()" />
    }

    <!--
      Lote de 20 em vez de paginação: no celular, "carregar mais" é rolar,
      enquanto paginar é mirar num número de 30px com o polegar.
    -->
    @if (temMais()) {
      <button type="button" class="pk-cartoes__mais" (click)="mostrarMais()">
        Mostrar mais {{ restantes() > 20 ? 20 : restantes() }}
        <span class="pk-cartoes__restantes">de {{ restantes() }} restantes</span>
      </button>
    }

  </div>
}
